# citrun-kernel.yaml — kernel-under-test matrix for the Jenkins kernel-test
# pipeline (gce-ciq-automation/jenkins/Jenkinsfile.kerneltest).
#
# Emulates the effective matrix of scn-sb-sync-and-test/gce-kernel-tests
# (gcloud_tests_*.sh via run_tests.sh), trimmed to one representative shape
# per arch/family instead of all 11 x86 VM shapes: for kernel validation the
# signal comes from arch, machine generation, driver presence (nvidia/gve)
# and metal-vs-VM, all of which the image list spans. All 12 images per arch
# are kept because kernel x image interaction is real (nvidia kmod builds,
# gve OOT driver). Each test VM runs the kernel-under-test via
# -custom_startup_script gce-kernel-tests/startup.sh (enables the
# ciq-sigcloud-next-testing repos, updates, reboots into the new kernel
# before the suite executes).
#
# Usage:
#   citrun run -config citrun-kernel.yaml \
#     -custom_startup_script /path/to/gce-kernel-tests/startup.sh
#   # slice: add -configs kernel-x86-vm (or kernel-arm-vm,
#   #        kernel-x86-metal, kernel-arm-metal, or a comma-list)
#
# Zone sets mirror run_tests.sh's per-shape region lists (lines 74-85,
# 267-335): default regions, t2a's zone list, and the two metal zone lists.
# Budgets are the region rows copied from citrun.yaml for exactly those
# regions.
project: ciq-test-servers
image_prefix: projects/gce-ciq-images/global/images/family
docker_image: cloud-image-tests
container_cap: 20
safety_factor: 0.9

budgets:
  networks: 90
  subnetworks: 275
  regions:
    europe-west1:    {CPUS: 3000, C3_CPUS: 1920, C4_CPUS: 300, C4A_CPUS: 300, N2_CPUS: 3000, N1_CPUS: 3000, T2A_CPUS: 300}
    europe-west4:    {CPUS: 3000, C3_CPUS: 300, C4A_CPUS: 960, N2_CPUS: 1500, T2A_CPUS: 300}
    asia-southeast1: {CPUS: 3000, C3_CPUS: 300, C4_CPUS: 300, C4A_CPUS: 300, N2_CPUS: 1500, T2A_CPUS: 300}
    us-east1:        {CPUS: 3000, C3_CPUS: 300, C4_CPUS: 300, C4A_CPUS: 300, N2_CPUS: 3000}
    us-east4:        {CPUS: 3000, C3_CPUS: 1920}
    us-west1:        {CPUS: 1500, C3_CPUS: 1920}
    us-central1:     {CPUS: 3000, C4A_CPUS: 1760, T2A_CPUS: 300}

zone_sets:
  # run_tests.sh REGIONS default (line 74-85), per-region zones.
  kernel-default: [europe-west1-b, europe-west1-c, europe-west1-d, europe-west4-a, europe-west4-b, europe-west4-c, asia-southeast1-a, asia-southeast1-b, asia-southeast1-c, us-central1-c]
  # t2a zones from run_tests.sh:334.
  kernel-t2a:     [us-central1-a, us-central1-b, us-central1-f, europe-west4-a, europe-west4-b, europe-west4-c, asia-southeast1-b, asia-southeast1-c]
  # c3-standard-192-metal metal-confirmed zones from run_tests.sh:273.
  kernel-metal-c3: [europe-west1-b, us-central1-a, us-east4-a, us-west1-a]
  # c4a-highmem-96-metal zones from run_tests.sh:292.
  kernel-metal-c4a: [us-central1-b, us-central1-f]

shapes:
  # x86 VM: one shape per generation to span n1/n2/c3/c4 machine families.
  n1-standard-4:  {arch: x86, cpus: 4, family: CPUS,     zone_set: kernel-default}
  n2-standard-4:  {arch: x86, cpus: 4, family: N2_CPUS,  zone_set: kernel-default}
  c4-standard-4:  {arch: x86, cpus: 4, family: C4_CPUS,  zone_set: kernel-default}
  # highcpu: exercises the nvidia driver stack on a thin-CPU shape.
  c3-highcpu-4:   {arch: x86, cpus: 4, family: C3_CPUS,  zone_set: kernel-default}
  # arm VM: t2a (Arm Neoverse) + c4a (Axion), the two arm families in the matrix.
  t2a-standard-2: {arch: arm64, cpus: 2, family: T2A_CPUS, zone_set: kernel-t2a}
  c4a-standard-4: {arch: arm64, cpus: 4, family: C4A_CPUS, zone_set: kernel-default}
  # metal: one per arch, 192/96 CPUs.
  c3-standard-192-metal:  {arch: x86,   cpus: 192, family: C3_CPUS,  zone_set: kernel-metal-c3,  metal: true}
  c4a-highmem-96-metal:   {arch: arm64, cpus: 96,  family: C4A_CPUS, zone_set: kernel-metal-c4a, metal: true}

suites:
  # imageboot = boot + secureboot checks (gcloud_tests_1.sh / _2_arm.sh).
  # packagevalidation = the metal scripts' suite (gcloud_tests_3.sh / .sh).
  imageboot:        {vms: 4, timeout: 45m, est: 4m}
  packagevalidation: {vms: 6, timeout: 45m, est: 2m30s}

matrix:
  - name: kernel-x86-vm
    shapes: [n1-standard-4, n2-standard-4, c4-standard-4, c3-highcpu-4]
    images: &x86images
      - rocky-linux-8
      - rocky-linux-9
      - rocky-linux-10
      - rocky-linux-8-optimized-gcp
      - rocky-linux-9-optimized-gcp
      - rocky-linux-10-optimized-gcp
      - rocky-linux-8-optimized-gcp-nvidia-580
      - rocky-linux-9-optimized-gcp-nvidia-580
      - rocky-linux-10-optimized-gcp-nvidia-580
      - rocky-linux-8-optimized-gcp-nvidia-latest
      - rocky-linux-9-optimized-gcp-nvidia-latest
      - rocky-linux-10-optimized-gcp-nvidia-latest
    suites: [imageboot]
  - name: kernel-arm-vm
    shapes: [t2a-standard-2, c4a-standard-4]
    images: &armimages
      - rocky-linux-8-arm64
      - rocky-linux-9-arm64
      - rocky-linux-10-arm64
      - rocky-linux-8-optimized-gcp-arm64
      - rocky-linux-9-optimized-gcp-arm64
      - rocky-linux-10-optimized-gcp-arm64
      - rocky-linux-8-optimized-gcp-nvidia-580-arm64
      - rocky-linux-9-optimized-gcp-nvidia-580-arm64
      - rocky-linux-10-optimized-gcp-nvidia-580-arm64
      - rocky-linux-8-optimized-gcp-nvidia-latest-arm64
      - rocky-linux-9-optimized-gcp-nvidia-latest-arm64
      - rocky-linux-10-optimized-gcp-nvidia-latest-arm64
    suites: [imageboot]
  - name: kernel-x86-metal
    shapes: [c3-standard-192-metal]
    images: *x86images
    suites: [packagevalidation]
  - name: kernel-arm-metal
    shapes: [c4a-highmem-96-metal]
    images: *armimages
    suites: [packagevalidation]

rules:
  # run_tests.sh:249-254: no rocky-8 on c4a metal (mirror of the bash drop).
  - drop: {shapes: [c4a-highmem-96-metal], images: ["rocky-linux-8*"]}
  # Metal boots are slow; give every metal job more headroom (citrun.yaml:228).
  - timeout: {shapes: ["*-metal"], value: 45m}
