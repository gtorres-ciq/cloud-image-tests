# citrun.yaml — the full CIT matrix as data.
project: ciq-test-servers
image_prefix: projects/gce-ciq-images/global/images/family
docker_image: cloud-image-tests
container_cap: 40
safety_factor: 0.9

budgets:
  networks: 90
  subnetworks: 275
  # All quotas below verified 2026-10-14:
  # - CPUS/N2_CPUS/N2D_CPUS/E2_CPUS/C2/C2D/C3_CPUS/T2A_CPUS/T2D_CPUS via
  #   `gcloud compute regions describe <region> --project ciq-test-servers`.
  # - C4/C4A/C4D/N4/C3D/Z4D/U4S/U4C family quotas via the Cloud Quotas API
  #   (quotaInfos/CPUS-PER-VM-FAMILY-per-project-{region,zone}); these are NOT
  #   exposed by regions describe or validateOnly inserts.
  #   C4/C4A/C4D/N4/C3D are 300/300/500/1500-3000/500 in every non-us-central1
  #   region EXCEPT europe-west4, where the C4A quota is 1760 (verified
  #   2026-10-30 via the Cloud Quotas API after a second increase) — big
  #   enough for every c4a-highmem-96-metal suite, so no arm-metal jobs need
  #   us-central1 (zone_set metal-c4a-big).
  regions:
    europe-west1:    {CPUS: 3000, C3_CPUS: 1920, C3D_CPUS: 500, C4_CPUS: 300, C4A_CPUS: 300, N2_CPUS: 3000, N2D_CPUS: 3000, N4_CPUS: 3000, E2_CPUS: 600, C2_CPUS: 500, C2D_CPUS: 1000, T2A_CPUS: 300, T2D_CPUS: 128}
    # europe-west4 C4A quota is 1760 (verified 2026-10-30 via the Cloud Quotas
    # API). The stockout caution for C3 metal still applies
    # (49% stockout+quota rate; see gce-capacity-transient-failure-report.md).
    us-central1:     {CPUS: 3000, C3_CPUS: 1920, C3D_CPUS: 500, C4_CPUS: 300, C4A_CPUS: 1760, N2_CPUS: 3000, N2D_CPUS: 3000, N4_CPUS: 3000, E2_CPUS: 600, C2_CPUS: 500, C2D_CPUS: 1000, T2A_CPUS: 300, T2D_CPUS: 128}
    europe-west3:    {CPUS: 3000, N2_CPUS: 1500, N2D_CPUS: 1500, E2_CPUS: 600, C3_CPUS: 300, T2A_CPUS: 300, T2D_CPUS: 128, C4A_CPUS: 300}
    europe-west4:    {CPUS: 3000, C3_CPUS: 300, C3D_CPUS: 500, C4_CPUS: 300, C4A_CPUS: 1760, C4D_CPUS: 500, N2_CPUS: 1500, N2D_CPUS: 3000, N4_CPUS: 1500, E2_CPUS: 600, T2A_CPUS: 300, T2D_CPUS: 128}
    asia-southeast1: {CPUS: 3000, C3_CPUS: 300, C3D_CPUS: 500, C4_CPUS: 300, C4A_CPUS: 300, C4D_CPUS: 500, N2_CPUS: 1500, N2D_CPUS: 3000, N4_CPUS: 1500, E2_CPUS: 600, T2A_CPUS: 300, T2D_CPUS: 128}
    us-east1:        {CPUS: 3000, C3_CPUS: 1920, C3D_CPUS: 500, C4_CPUS: 300, C4A_CPUS: 300, N2_CPUS: 3000, N2D_CPUS: 3000, N4_CPUS: 3000, E2_CPUS: 600, T2A_CPUS: 300}
    us-east4:        {CPUS: 3000, C3_CPUS: 1920, C3D_CPUS: 500, C4_CPUS: 300, C4A_CPUS: 300, N2_CPUS: 3000, N2D_CPUS: 3000, N4_CPUS: 3000, T2A_CPUS: 300}
    us-west1:        {CPUS: 1500, C3_CPUS: 1920, N4_CPUS: 1500}
    # us-east5 CPUS measured 2026-10-06 via regions describe. Z4D_CPUS is the
    # per-VM-family quota (Cloud Quotas API); Z4D quota exists only in us-east5.
    # C3_CPUS 1568 granted 2026-10-30 (verified via regions describe).
    us-east5:        {CPUS: 750, C3_CPUS: 1568, C4A_CPUS: 300, Z4D_CPUS: 384}
    # U4 quotas are zonal (CPUS-PER-VM-FAMILY-per-project-zone). Keep U4S
    # serialized until the scheduler supports zonal budgets, and use one
    # zone's measured allocation as a safe cap.
    us-south1:       {CPUS: 1152, U4S_CPUS: 1152, U4C_CPUS: 480}

zone_sets:
  # Zone availability verified 2026-10-14 via
  # `gcloud compute machine-types list --project=ciq-test-servers --format='value(name,zone.basename())'`.
  # us-central1 excluded except for the C3 metal fallback: 49% stockout+quota rate
  # (us-central1-c alone ~493 stockout attempts) across May–Oct 2026, while
  # europe-west1/europe-west4/asia-southeast1 ran at 2–6%.
  # default (was: + us-central1-c): 12 zones across europe-west1/4, asia-southeast1, us-east1
  default:      [europe-west1-b, europe-west1-c, europe-west1-d, europe-west4-a, europe-west4-b, europe-west4-c, asia-southeast1-a, asia-southeast1-b, asia-southeast1-c, us-east1-b, us-east1-c, us-east1-d]
  # t2a only exists in us-central1-a/b/f, europe-west4-a/b/c, asia-southeast1-b/c;
  # asia-southeast1-b/c ran 112/112 clean (us-central1-a/b had 190+ n4a stockouts).
  t2a:          [asia-southeast1-b, asia-southeast1-c, europe-west4-a, europe-west4-b, europe-west4-c]
  # n4d verified in these zones; us-central1-a/b/c and us-east1-b/d dropped
  # (n4d stockout hotspots: us-central1-c 60, us-central1-b 40, us-east1-b 37,
  # us-east1-d 30 in the archive era).
  n4d:          [europe-west1-b, europe-west1-c, europe-west1-d, europe-west4-a, europe-west4-b, europe-west4-c, asia-southeast1-a, asia-southeast1-b, asia-southeast1-c]
  # n4a verified in these zones; us-central1-a/b dropped (190 stockout attempts
  # in us-central1-b alone). us-east1-b ran 114/114 clean on n4a.
  n4a:          [us-east1-b, us-east1-c, us-east1-d, us-west1-a, europe-west1-b, europe-west1-c, asia-southeast1-a, asia-southeast1-b, asia-southeast1-c]
  # c4d never has enough quota in europe-west1-* / us-central1-c (measured
  # historically); c4d ran 0 stockouts in 254 attempts on this set + europe-west4-b.
  c4d:          [europe-west4-a, europe-west4-b, europe-west4-c, asia-southeast1-a, asia-southeast1-b, asia-southeast1-c]
  # c4-hotattach used to exclude us-central1 (c4 hotattach known issue,
  # run_tests.sh:360-370); with us-central1 gone it is identical to default.
  # Kept as a named set for the rule below.
  c4-hotattach: [europe-west1-b, europe-west1-c, europe-west1-d, europe-west4-a, europe-west4-b, europe-west4-c, asia-southeast1-a, asia-southeast1-b, asia-southeast1-c, us-east1-b, us-east1-c, us-east1-d]
  # c3-standard-192-metal availability: us-central1-a, europe-west1-b/c/d,
  # us-west1-a/b, us-east1-b/c/d, asia-northeast1-b, asia-southeast1-a/c,
  # us-east4-a/c, europe-west4-c, us-east5-a/b, us-south1-b, me-central1-a/c.
  # us-central1-a restored as a fallback on 2026-10-15: type offered,
  # C3_CPUS quota 1920 (76 used at verification). A live allocation probe
  # returned STOCKOUT on 2026-10-15; retain it as a fallback for later retries.
  # us-west1-a (34 stockouts) and us-east4-a (30) remain excluded.
  # us-east4-a, us-east1-c/d, us-east5-a/b added 2026-10-30 after C3_CPUS
  # increases (1920 us-east1, 1568 us-east5; verified via regions describe +
  # machine-types list); us-east4-a re-added by request to spread the load.
  metal-c3:     [us-east4-c, us-east4-a, us-west1-b, europe-west1-b, europe-west1-c, europe-west1-d, us-east1-b, us-east1-c, us-east1-d, us-east5-a, us-east5-b, asia-southeast1-a, asia-southeast1-c, us-central1-a]
  # c4a-highmem-96-metal availability outside us-central1: europe-west3-a/b/c,
  # europe-west4-a/b/c, asia-northeast1-a/b, us-east4-c, us-east5-b, us-west4-a/c.
  # C4A quota is 300 in europe-west3/us-east4/us-east5, so only 1-VM suites
  # (96 CPU) run in this set; the multi-VM suites go through the
  # metal-c4a-big zone_set rule below (europe-west4 raised to 1760).
  metal-c4a:    [europe-west4-a, europe-west4-b, europe-west4-c, europe-west3-a, europe-west3-b, us-east4-c, us-east5-b]
  # europe-west4 is the only non-us-central1 region whose C4A quota (1760,
  # usable 1584) fits the 6-8 VM c4a-highmem-96-metal suites. Verified
  # 2026-10-30 via the Cloud Quotas API.
  metal-c4a-big: [europe-west4-a, europe-west4-b, europe-west4-c]
  u4s:          [us-south1-d, us-south1-e]
  u4c:          [us-south1-d, us-south1-e]
  # sv-flex moved off us-central1 (shapevalidation stockouts: n2-highmem-128
  # 90%, c3-highmem-176 92%, c4-highmem-192 58% in us-central1/us-east4-a).
  # All sv shapes verified available in europe-west1-* and asia-southeast1-*.
  sv-flex:      [europe-west1-b, europe-west1-c, europe-west1-d, asia-southeast1-a, asia-southeast1-b, asia-southeast1-c]
  # Z4D machine type is offered in us-central1/us-east4/us-east5, but the
  # project only has Z4D CPU quota in us-east5 (384, verified 2026-10-15).
  # Z4D LOCAL_SSD_TOTAL_GB_PER_VM_FAMILY is currently 0 in all regions.
  # Request 84000 GB in us-east5 to cover the 24 VMs allowed by 384 CPUs
  # (3500 GiB per VM); at least 28000 is needed for one 8-VM metadata job.
  z4d:          [us-east5-b, us-east5-c]

shapes:
  # family = the per-VM-family budget key charged alongside CPUS. Values
  # verified 2026-10-14 via the Cloud Quotas API (CPUS-PER-VM-FAMILY).
  n1-standard-4:         {arch: x86, cpus: 4, family: CPUS,     zone_set: default}
  n2-standard-4:         {arch: x86, cpus: 4, family: N2_CPUS,  zone_set: default}
  c3-standard-4:         {arch: x86, cpus: 4, family: C3_CPUS,  zone_set: default}
  c4-standard-4:         {arch: x86, cpus: 4, family: C4_CPUS,  zone_set: default}
  c3d-standard-4:        {arch: x86, cpus: 4, family: C3D_CPUS, zone_set: default}
  c4d-standard-4:        {arch: x86, cpus: 4, family: C4D_CPUS, zone_set: c4d}
  n4d-standard-2:        {arch: x86, cpus: 2, family: N4_CPUS,  zone_set: n4d}
  n4-highcpu-2:          {arch: x86, cpus: 2, family: N4_CPUS,  zone_set: default}
  c3-highcpu-4:          {arch: x86, cpus: 4, family: C3_CPUS,  zone_set: default}
  c4-highcpu-4:          {arch: x86, cpus: 4, family: C4_CPUS,  zone_set: default}
  n2-highcpu-2:          {arch: x86, cpus: 2, family: N2_CPUS,  zone_set: default}
  t2a-standard-2:        {arch: arm64, cpus: 2, family: T2A_CPUS, zone_set: t2a}
  c4a-standard-4:        {arch: arm64, cpus: 4, family: C4A_CPUS, zone_set: default}
  n4a-standard-2:        {arch: arm64, cpus: 2, family: N4_CPUS,  zone_set: n4a, max_parallel: 12}
  c3-standard-192-metal: {arch: x86,   cpus: 192, family: C3_CPUS,  zone_set: metal-c3,  metal: true}
  c4a-highmem-96-metal:  {arch: arm64, cpus: 96,  family: C4A_CPUS, zone_set: metal-c4a, metal: true}
  # U4 quotas are per zone; serialize this shape until citrun models zonal budgets.
  u4s-standard-4:        {arch: x86, cpus: 4, family: U4S_CPUS, zone_set: u4s, max_parallel: 1}
  # U4C quota is zonal. The dedicated smoke suite creates one VM, and
  # max_parallel keeps bare-metal provisioning serialized across both zones.
  u4c-highcpu-120-lssd-metal: {arch: x86, cpus: 120, family: U4C_CPUS, zone_set: u4c, metal: true, max_parallel: 1}
  z4d-highmem-16-standardlssd: {arch: x86, cpus: 16, family: Z4D_CPUS, zone_set: z4d}

# est = median wall-clock; timeout ≈ max(15m, ~3×median).
suites:
  cvm:                {vms: 6,  timeout: 35m, est: 10m30s}
  disk:               {vms: 2,  timeout: 20m, est: 5m}
  guestagent:         {vms: 7,  timeout: 25m, est: 5m30s}
  hostnamevalidation: {vms: 2,  timeout: 20m, est: 3m30s}
  hotattach:          {vms: 1,  timeout: 20m, est: 3m30s}
  imageboot:          {vms: 4,  timeout: 20m, est: 4m}
  licensevalidation:  {vms: 1,  timeout: 20m, est: 3m}
  livemigrate:        {vms: 1,  timeout: 25m, est: 6m}
  loadbalancer:       {vms: 6, networks: 1, subnets: 2, timeout: 30m, est: 17m}
  lssd:               {vms: 1,  timeout: 15m, est: 3m}
  metadata:           {vms: 8,  timeout: 20m, est: 5m}
  network:            {vms: 3, networks: 2, subnets: 2, timeout: 35m, est: 10m}
  packagevalidation:  {vms: 6,  timeout: 15m, est: 2m30s}
  security:           {vms: 1,  timeout: 15m, est: 2m30s}
  ssh:                {vms: 4,  timeout: 30m, est: 11m}
  suspendresume:      {vms: 1,  timeout: 20m, est: 3m30s}
  vmspec:             {vms: 1, networks: 2, subnets: 2, timeout: 35m, est: 6m30s}
  shapevalidation:    {vms: 1,  timeout: 30m, est: 5m30s}
  u4c:                {vms: 1, networks: 2, subnets: 3, timeout: 45m, est: 10m}

matrix:
  - name: x86
    shapes: [n1-standard-4, n2-standard-4, c3-standard-4, c4-standard-4, c3d-standard-4, c4d-standard-4, n4d-standard-2, n4-highcpu-2, c3-highcpu-4, c4-highcpu-4, n2-highcpu-2, z4d-highmem-16-standardlssd]
    images: &x86images
      - rocky-linux-8
      - rocky-linux-9
      - rocky-linux-10
      - rocky-linux-8-optimized-gcp
      - rocky-linux-9-optimized-gcp
      - rocky-linux-10-optimized-gcp
      - rocky-linux-8-optimized-gcp-nvidia-580
      - rocky-linux-9-optimized-gcp-nvidia-580
      - rocky-linux-10-optimized-gcp-nvidia-580
      - rocky-linux-8-optimized-gcp-nvidia-latest
      - rocky-linux-9-optimized-gcp-nvidia-latest
      - rocky-linux-10-optimized-gcp-nvidia-latest
      - rocky-linux-10-optimized-gcp-oot-gve
    suites: &allsuites [cvm, disk, guestagent, hostnamevalidation, hotattach, imageboot, licensevalidation, livemigrate, loadbalancer, lssd, metadata, network, packagevalidation, security, ssh, suspendresume, vmspec]
  - name: arm
    shapes: [t2a-standard-2, c4a-standard-4, n4a-standard-2]
    images: &armimages
      - rocky-linux-8-arm64
      - rocky-linux-9-arm64
      - rocky-linux-10-arm64
      - rocky-linux-8-optimized-gcp-arm64
      - rocky-linux-9-optimized-gcp-arm64
      - rocky-linux-10-optimized-gcp-arm64
      - rocky-linux-8-optimized-gcp-nvidia-580-arm64
      - rocky-linux-9-optimized-gcp-nvidia-580-arm64
      - rocky-linux-10-optimized-gcp-nvidia-580-arm64
      - rocky-linux-8-optimized-gcp-nvidia-latest-arm64
      - rocky-linux-9-optimized-gcp-nvidia-latest-arm64
      - rocky-linux-10-optimized-gcp-nvidia-latest-arm64
    suites: *allsuites
  - name: arm-metal
    shapes: [c4a-highmem-96-metal]
    images: *armimages
    suites: *allsuites
  - name: x86-metal
    shapes: [c3-standard-192-metal]
    images: *x86images
    suites: *allsuites
  - name: u4s
    each_zone: true
    shapes: [u4s-standard-4]
    images: [rocky-linux-10-optimized-gcp-oot-gve]
    suites: *allsuites
  - name: u4c
    each_zone: true
    shapes: [u4c-highcpu-120-lssd-metal]
    images: [rocky-linux-10-optimized-gcp-oot-gve]
    suites: [u4c]

# Rules apply to matrix configs only; shapevalidation families below are self-contained (zones/cpus per family) and only quarantine applies to them.
rules:
  # Suite gating (run_tests.sh:213-243)
  - suite_only_on: {suites: [disk],   shapes: ["t2a-standard*", "c3d-standard*"]}
  - suite_only_on: {suites: [lssd],   shapes: ["c3-standard*"]}
  - suite_only_on: {suites: [cvm],    shapes: ["n2d-standard*", "c3-standard*"]}
  - suite_only_on: {suites: [vmspec], shapes: ["n1-standard*", "n2-standard*", "n2d-standard*"]}
  # highcpu keep-list (run_tests.sh:338-350)
  - keep_only: {shapes: ["*-highcpu-*"], suites: [network, ssh, loadbalancer, metadata, imageboot, u4c]}
  # c3 metal drops (run_tests.sh:264-284): disk/vmspec already gone via suite_only_on;
  # cvm/lssd's "c3-standard*" glob also matches this metal shape, so drop them here too
  - drop: {shapes: [c3-standard-192-metal], suites: [cvm, lssd, livemigrate, suspendresume, imageboot, network, packagevalidation]}
  # c4a metal keep-list + no rocky-8 (run_tests.sh:244-263)
  - keep_only: {shapes: [c4a-highmem-96-metal], suites: [suspendresume, licensevalidation, loadbalancer, metadata, packagevalidation]}
  - drop: {shapes: [c4a-highmem-96-metal], images: ["rocky-linux-8*"]}
  # C4A quota is 300 in europe-west3/us-east4/us-east5 (fits only 1-VM suites
  # at 96 CPU); europe-west4 has 1760. Splits the arm-metal matrix:
  # loadbalancer/metadata/packagevalidation -> europe-west4, the 1-VM
  # suspendresume/licensevalidation suites spread across europe/us-east4/us-east5.
  - zone_set: {shapes: [c4a-highmem-96-metal], suites: [loadbalancer, metadata, packagevalidation], set: metal-c4a-big}
  # c4 hotattach avoids us-central1 (run_tests.sh:360-370)
  - zone_set: {shapes: ["c4-standard*"], suites: [hotattach], set: c4-hotattach}
  # U4 does not support simulated host maintenance events.
  - drop: {shapes: ["u4s-*"], suites: [livemigrate]}
  # Z-series is TERMINATE-only (fixtures.go knownTerminateOnlyMachineRegexes),
  # so the MIGRATE-based livemigrate suite cannot run on z4d.
  - drop: {shapes: ["z4d-*"], suites: [livemigrate]}
  # Metal boots are slow; give every metal job more headroom
  - timeout: {shapes: ["*-metal"], value: 45m}

# Tier lists from gce-mandate-vs-flagonly-lists.md (per-attempt outcomes,
# Sep 8 – Oct 14 2026, buggy runs excluded). Selected with
# `citrun run -tier 1` (MANDATE) or `-tier 2` (FLAG-ONLY); the default
# (no -tier / -tier all) runs the full matrix and never consults this data.
#
# Semantics: a tier entry REPLACES the job's zone sweep (Job.Zones) with the
# listed zones — it does not intersect the shape's zone_set, because most
# tier-2 zones (us-central1-*, us-west1-*, us-east1-*) were deliberately
# dropped from today's zone_sets. Shapes with no entry in the tier are
# excluded, and shapevalidation families do not run under a tier. Images are
# NOT restricted by a tier (List 1's "images covered" columns are not
# encoded); the job counts per config are therefore unchanged vs the full
# matrix for listed shapes.
tiers:
  "1":
    # List 1 — MANDATE: zero stockouts, zero quota errors, zero test failures
    # across every attempt observed. Capacity-assurance matrix.
    - {shape: n4a-standard-2,       zones: [us-east1-b]}
    - {shape: t2a-standard-2,       zones: [asia-southeast1-b, asia-southeast1-c]}
    - {shape: c4a-standard-4,       zones: [europe-west1-d]}
    - {shape: c3-highcpu-4,         zones: [europe-west1-d, europe-west4-b, asia-southeast1-b]}
    - {shape: n2-highcpu-2,         zones: [europe-west1-c, europe-west1-d]}
    - {shape: c4a-highmem-96-metal, zones: [europe-west4-c]}
    - {shape: n4-highcpu-2,         zones: [asia-southeast1-c, europe-west4-a, europe-west4-b, europe-west4-c]}
    - {shape: c4d-standard-4,       zones: [asia-southeast1-a, asia-southeast1-c, europe-west4-b, europe-west4-c]}
    - {shape: n2-standard-4,        zones: [europe-west4-b, europe-west4-c, asia-southeast1-c]}
    - {shape: c4-standard-4,        zones: [asia-southeast1-b, asia-southeast1-c, europe-west4-b]}
    - {shape: c3d-standard-4,       zones: [asia-southeast1-a, asia-southeast1-b, asia-southeast1-c, europe-west4-b]}
  "2":
    # List 2 — FLAG-ONLY: capacity-bound placements (Tier 1 >90% infra and
    # Tier 2 25–90% infra tables combined). Genuine test failures here are
    # real signals; stockout churn is a capacity problem, not an image signal.
    - {shape: n4d-standard-2,       zones: [us-central1-a, us-central1-b, us-central1-c, europe-west4-a, europe-west4-b, us-east1-b, us-east1-d]}
    - {shape: n4-highcpu-2,         zones: [us-central1-c, europe-west1-c]}
    - {shape: c3-standard-192-metal, zones: [us-east4-c, us-west1-b, us-east1-b, asia-southeast1-a, asia-southeast1-c, europe-west1-d, us-central1-a, europe-west1-c, europe-west1-b, us-west1-a, us-east4-a]}
    - {shape: n4a-standard-2,       zones: [us-central1-b]}
    - {shape: c3-standard-4,        zones: [us-central1-c]}
    - {shape: c4-standard-4,        zones: [us-central1-c]}
    - {shape: c4-highcpu-4,         zones: [us-central1-c]}
    - {shape: c4a-highmem-96-metal, zones: [us-central1-b, us-central1-c, us-central1-f]}
    - {shape: n2-standard-4,        zones: [us-central1-c]}
    - {shape: n2-highcpu-2,         zones: [us-central1-c]}
    - {shape: c4d-standard-4,       zones: [europe-west4-a]}

quarantine:
  # GCE Secure Boot rejects the rocky-8 optimized-gcp shim; base rocky-8 passes.
  # Whole imageboot suite skipped for these images until the shim is re-signed.
  # Uncommented for Sept builds - GT
  # - {image: rocky-linux-8-optimized-gcp,               suite: imageboot, reason: "secureboot shim rejected by GCE"}
  # - {image: rocky-linux-8-optimized-gcp-nvidia-580,    suite: imageboot, reason: "secureboot shim rejected by GCE"}
